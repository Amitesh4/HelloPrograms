<!DOCTYPE html>
<html>
<body>

    <h3>Simple Adder</h3>
    <input id="a" type="number" placeholder="Num 1">
    <input id="b" type="number" placeholder="Num 2">
    <button onclick="add()">Add Now</button>

    <p>Result: <b id="ans">Waiting...</b></p>

    <script>
    function add() {
        var val1 = document.getElementById("a").value;
        var val2 = document.getElementById("b").value;
        
        console.log("Input A:", val1); // This shows in the F12 Console
        console.log("Input B:", val2);

        var x = Number(val1);
        var y = Number(val2);
        
        var sum = x + y;
        document.getElementById("ans").innerHTML = sum;
        
        console.log("Sum is:", sum);
    }
    </script>

</body>
</html>
